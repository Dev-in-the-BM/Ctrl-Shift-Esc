        - heading "GroupMe SMS is dead, now what?" [level=1] [ref=f40e117]
        - paragraph [ref=f40e118]:
          - time [ref=f40e119]: Aug 19, 2026
          - link "Typed With T9" [ref=f40e120] [cursor=pointer]:
            - /url: /In-Plaintext/category/typed-with-t9
        - paragraph [ref=f40e121]: The frum world relied on GroupMe's SMS feature for group chats. That's now gone. What do we do now?
      - generic [ref=f40e122]:
        - navigation "On this page" [ref=f40e123]:
          - group [ref=f40e124]:
            - generic "On this page" [ref=f40e125] [cursor=pointer]
        - img "The frum world relied on GroupMe's SMS feature for group chats. That's now gone. What do we do now?" [ref=f40e126]
        - generic [ref=f40e128]:
          - heading "The frum world in the digital age" [level=3] [ref=f40e129]
          - paragraph [ref=f40e130]: The year is 2026.
          - paragraph [ref=f40e131]: Most of the world has gone completely online.Many live their entire lives from behind their glass rectangle.
          - paragraph [ref=f40e132]: And then we have the frum world, where large segments continue to choose to use technology more intentionally.
          - paragraph [ref=f40e133]: With the realities of the 21st century, we often have to be creative to bypass using smartphones and the internet.
          - heading "GroupMe and DumpMe" [level=3] [ref=f40e134]
          - paragraph [ref=f40e135]: One of the tools many of us have used is GroupMe’s SMS feature, allowing us to have group chats without having to rely on online platforms.
          - paragraph [ref=f40e136]: Many family, neighborhood, chesed, and other chats relied on this.
          - paragraph [ref=f40e137]: While most of us have cellphone plans that give us unlimited texting, network providers charge platforms for every text sent and received.This, combined with price increases introduced over the years, has made GroupMe’s SMS feature unsustainable, and GroupMe has recently announced that they are shutting down their SMS system.
          - heading "What about alternatives?" [level=3] [ref=f40e138]
          - paragraph [ref=f40e139]: Because running such a service is so expensive, there don’t seem to be any SMS alternatives, and it’s very unlikely that there will be any in the future.
          - paragraph [ref=f40e140]: While MMS group chats are still around, they have limitations that make them impractical in many cases.
          - paragraph [ref=f40e141]: MMS group chats are limited to 20 people, and don’t allow adding or removing people.
          - paragraph [ref=f40e142]: All this means that traditional text-message-based group chats are no longer an option for many things that we relied on.
          - paragraph [ref=f40e144]:
            - text: "The question facing our community is:"
            - emphasis [ref=f40e145]: Now what?
          - paragraph [ref=f40e146]: To answer that, we have to first look at the options.Unfortunately, there aren’t too many.We can decide that we can do without group chats, or we can figure out if there’s a kosher way to use app-based platforms.
          - paragraph [ref=f40e147]: The question then is, what are the problems with app-based messaging platforms?
          - paragraph [ref=f40e148]: After all, most kosher phones today are essentially dumbed-down Android devices, and it’s the filter restricting what can run on the phone.
          - paragraph [ref=f40e149]: Why can’t the filters just allow WhatsApp?
          - paragraph [ref=f40e150]: "The answer is nuanced, and boils down to a few points:"
          - paragraph [ref=f40e151]:
            - img "Holding dumbphone" [ref=f40e152]
          - heading "1. Non-kosher features" [level=4] [ref=f40e153]
          - paragraph [ref=f40e154]: Most major messaging platforms, including WhatsApp and Telegram, offer features that are either completely not kosher, or aren’t up to the standards that a true basic kosher phone should keep to.
          - paragraph [ref=f40e155]: These include features like channels, status, and media sharing.
          - paragraph [ref=f40e156]: These can be very complex to completely block.
          - heading "2. Time not well spent" [level=4] [ref=f40e157]
          - paragraph [ref=f40e158]: Major smartphone apps have many features in them intentionally designed to make the app more engaging, and have users spend more time on it.
          - paragraph [ref=f40e159]: These include things like design language, animations, gamification, and social elements.
          - paragraph [ref=f40e160]: Even apps that should just be useful tools engage in this.
          - paragraph [ref=f40e161]: For example, Duolingo, an app that helps users learn new languages, has leaned heavily into gamification, streaks, competition, notifications, and adding social elements, to make users keep coming back to the app, and spending as much time on it as possible.
          - paragraph [ref=f40e162]: Therefore, even if an app may seem to be just an innocent utility, the reality is often otherwise.
          - heading "3. The gateway drug" [level=4] [ref=f40e163]
          - paragraph [ref=f40e164]: Many in our community have never been smartphone users, and intend to keep it that way.For them, a dumbphone isn’t just a more kosher device, it’s a strong boundary to keep away from smartphones.The basic dumbphone’s simple, low-featured nature is a stark contrast to the slick, distracting experience that the smartphone offers.Every app and smart feature added to a basic phone erodes this boundary.This is why many dumbphone filters refuse to allow even Waze on basic phones.
          - heading "4. Group chats themselves aren’t necessarily kosher" [level=4] [ref=f40e165]
          - paragraph [ref=f40e166]: While group chats can be a very useful tool, they can also be a trap.
          - paragraph [ref=f40e167]: Many chats can be time-wasting, filled with lashon hora and leitzanus, or just be a distraction from more important things.
          - paragraph [ref=f40e168]: While GroupMe chats were very often useful and kosher, others weren’t.In other words, group chats to begin with are somewhat of a bedi’eved.
          - paragraph [ref=f40e169]: As we can see, there can be many pitfalls to seemingly innocuous messaging platforms.
          - heading "Is there any way these problems can be solved?" [level=3] [ref=f40e170]
          - paragraph [ref=f40e171]: Let’s move over to the world of email for a second.
          - paragraph [ref=f40e172]: There are many more kosher devices offering email than WhatsApp.
          - paragraph [ref=f40e173]: Why is that?
          - paragraph [ref=f40e174]: Unlike WhatsApp and other major messaging platforms, which are tied to their own apps, email is an open protocol.
          - paragraph [ref=f40e175]: That means that anyone can run their own email service, or build their own email app, and it will be able to message and work with other email providers, as long as it keeps to email’s official protocols.
          - paragraph [ref=f40e176]: That’s why Gmail, Outlook, Yahoo Mail, and iCloud Mail can all email each other, and why you can use all of those in each other’s apps, or any other email app out there.
          - paragraph [ref=f40e177]: That’s also why the Sunbeam kosher phone is able to offer email with attachments blocked, and how Keyphone is considering offering text-only email, with graphics blocked, or an email app that would only show your last 30 days of emails.
          - paragraph [ref=f40e178]: Since anyone can build their own email app, which would work with any email provider, building email apps with custom restrictions is pretty simple.
          - paragraph [ref=f40e179]: Now if only such a thing existed for messaging, right?
          - paragraph [ref=f40e180]: That would make a lot of the kashrus problems inherent to these messaging platforms solvable.
          - heading [level=3] [ref=f40e181]:
            - text: Matt
            - emphasis [ref=f40e182]: who?
          - paragraph [ref=f40e183]:
            - text: Actually, such a thing
            - emphasis [ref=f40e184]: does
            - text: exist.It’s called Matrix, and while it’s still niche, it has tens of millions of active users, and offers all of the features that major messaging platforms have.Most importantly, anyone can build their own Matrix app that would work with any Matrix provider.
          - paragraph [ref=f40e185]: This would make a lot of the problems with messaging that we mentioned earlier easier to mitigate.
          - paragraph [ref=f40e186]: Non-kosher features can be blocked.
          - paragraph [ref=f40e187]: A kosher Matrix app could be purposefully designed to be utilitarian instead of engaging.
          - paragraph [ref=f40e188]: But the other two problems can’t be fully solved.
          - paragraph [ref=f40e189]: While a simpler app is a lot better than a full smartphone app, for basic phones it would still be a new smart feature, bringing it a step closer to smartphones.
          - paragraph [ref=f40e190]: There’s also no way to only allow chats that are completely kosher.
          - paragraph [ref=f40e191]: Which means that while a theoretical kosher Matrix app could solve some problems that other messaging platforms have, it would leave the others unsolved.
          - paragraph [ref=f40e192]: "This leaves us, as a community, and as individuals, with a question:"
          - paragraph [ref=f40e193]: How do we want to deal with this?
          - paragraph [ref=f40e194]: Are we willing to say goodbye to the convenience of group chats?
          - paragraph [ref=f40e195]: Or is it something that we can’t do without?
          - paragraph [ref=f40e196]: I’ve already spoken to the owner of one kosher phone company, who said he might be interested in making a kosher Matrix an option, if other kosher phone companies are also interested in doing this.
          - paragraph [ref=f40e197]:
            - text: "So then the question is: Do"
            - emphasis [ref=f40e198]: we
            - text: want it?
