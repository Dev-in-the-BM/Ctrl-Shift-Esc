                        - link "Heading link":
                          - /url: "#p-929307-bbcode-and-html-9"
                        - text: BBCode and HTML
                      - paragraph [ref=f13e501]: In addition to Markdown, Discourse supports a subset of BBCode and HTML.
                      - paragraph [ref=f13e502]:
                        - text: For HTML, use the
                        - code [ref=f13e503]: <pre>
                        - text: and
