                      - heading "Heading linkEntire line code formatting" [level=2] [ref=f13e476]:
                        - link "Heading link":
                          - /url: "#p-929307-entire-line-code-formatting-5"
                        - text: Entire line code formatting
                      - paragraph [ref=f13e477]: To format an entire line, add 4 spaces at the start of a line. All text until the next line break will be code.
                      - heading "Heading linkExample:" [level=3] [ref=f13e478]:
                        - link "Heading link":
                          - /url: "#p-929307-example-6"
                        - text: "Example:"
                      - paragraph [ref=f13e479]:
                        - strong [ref=f13e480]: "Typing:"
                      - generic [ref=f13e481]: All text after 4 spaces will be formatted.
                      - paragraph [ref=f13e482]:
                        - strong [ref=f13e483]: "Produces:"
                      - code [ref=f13e486]: All text after 4 spaces will be formatted.
                      - heading "Heading linkBlock code formatting" [level=2] [ref=f13e487]:
                        - link "Heading link":
                          - /url: "#p-929307-block-code-formatting-7"
                        - text: Block code formatting
                      - paragraph [ref=f13e488]: While you can use the 4-space method to produce multiple lines of code, this can be tedious, especially if you are copying and pasting and need to type 4 spaces on multiple lines of text.
                      - paragraph [ref=f13e489]:
                        - text: "Instead, use 3 backticks (```)"
                        - strong [ref=f13e490]: on their own line
                        - text: above and below your code. Be sure there are no spaces on the lines with the backticks, or this will not work.
                      - heading "Heading linkExample:" [level=3] [ref=f13e491]:
                        - link "Heading link":
                          - /url: "#p-929307-example-8"
                        - text: "Example:"
                      - paragraph [ref=f13e492]:
                        - strong [ref=f13e493]: "Typing:"
