                      - blockquote [ref=f13e444]:
                        - paragraph [ref=f13e445]:
                          - img ":bookmark:" [ref=f13e446]
                          - text: This guide explains how to post code or preformatted text in Discourse using Markdown, BBCode, and HTML formats.
                        - paragraph [ref=f13e447]:
                          - img ":person_raising_hand:" [ref=f13e448]
                          - text: "Required user level: All users"
                      - paragraph [ref=f13e449]: Have a line of code you need to share? Maybe you need to share an error log from your site? Reading unformatted code can be challenging, especially if the code depends on spacing or contains special characters that Discourse transforms.
                      - heading "Heading linkSummary" [level=2] [ref=f13e450]:
                        - link "Heading link":
                          - /url: "#p-929307-summary-1"
                        - text: Summary
                      - paragraph [ref=f13e451]: "In this guide, you’ll learn:"
                      - list [ref=f13e452]:
                        - listitem [ref=f13e453]: How to format inline code.
                        - listitem [ref=f13e454]: How to format entire lines of code.
                        - listitem [ref=f13e455]: How to format blocks of code.
                        - listitem [ref=f13e456]: How to use BBCode and HTML for code formatting.
                        - listitem [ref=f13e457]: How to disable automatic code styling.
                      - heading "Heading linkInline code formatting" [level=2] [ref=f13e458]:
                        - link "Heading link":
                          - /url: "#p-929307-inline-code-formatting-2"
                        - text: Inline code formatting
                      - paragraph [ref=f13e459]: To format a specific section of text, use a single backtick on each side of the code. This can be done within regular text, or when the code is on its own line. Inline formatting does not apply any automatic code formatting (see below), and only applies the “code style” to the text between backticks.
                      - heading "Heading linkExample 1:" [level=3] [ref=f13e460]:
                        - link "Heading link":
                          - /url: "#p-929307-example-1-3"
                        - text: "Example 1:"
                      - paragraph [ref=f13e461]:
