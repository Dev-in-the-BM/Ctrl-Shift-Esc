                      - paragraph [ref=f13e464]:
                        - strong [ref=f13e465]: "Produces:"
                      - paragraph [ref=f13e466]:
                        - code [ref=f13e467]: This is a line of code
                      - heading "Heading linkExample 2:" [level=3] [ref=f13e468]:
                        - link "Heading link":
                          - /url: "#p-929307-example-2-4"
                        - text: "Example 2:"
