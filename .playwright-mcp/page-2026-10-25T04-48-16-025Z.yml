        - 'heading "Dumbing down your smartphone, smarting up your dumbphone, and more: ADB for dummies" [level=1] [ref=f33e23]'
        - paragraph [ref=f33e24]: Strip the junk off a smartphone, or force-install essentials onto a basic flip phone. ADB can let you do all that and more - and you don't need to be a techie to use it.
      - generic [ref=f33e25]:
        - group [ref=f33e26]:
          - generic "On this page" [ref=f33e27] [cursor=pointer]:
            - text: On this page
            - generic [aria-hidden] [ref=f33e28]: ⌄
        - generic [ref=f33e29]:
          - 'img "Dumbing down your smartphone, smarting up your dumbphone, and more: ADB for dummies" [ref=f33e30]'
          - generic [ref=f33e31]:
            - heading "What is ADB?" [level=2] [ref=f33e32]
            - paragraph [ref=f33e33]: ADB is a tool that you can use from your computer to do a lot things to Android phones that can’t be done from the phone itself.
            - paragraph [ref=f33e34]: "With ADB, you can:"
            - list [ref=f33e35]:
              - listitem [ref=f33e36]:
                - strong [ref=f33e37]: Uninstall apps
              - listitem [ref=f33e38]:
                - strong [ref=f33e39]: Install apps
              - listitem [ref=f33e40]:
                - strong [ref=f33e41]: Manage app permissions
              - listitem [ref=f33e42]:
                - strong [ref=f33e43]: Change phone settings
            - paragraph [ref=f33e44]: Often, ADB will let you do more than the phone itself lets.
            - paragraph [ref=f33e45]: You can use it to uninstall apps that came with the phone, install apps on some dumbphones that restrict installing APKs directly on the phone, and change phone settings and app permissions that you can’t set from the phone itself.
            - paragraph [ref=f33e46]: All this can be very useful for dumbing down devices, and extending the functionality of dumbphones.
            - heading "Do I have to learn how to type up commands to use ADB?" [level=3] [ref=f33e47]
            - paragraph [ref=f33e48]: While ADB is really a command line tool, there are a bunch of easy to use GUI apps that let you use a lot of ADB features without having to know any ADB commands.
            - paragraph [ref=f33e49]:
              - text: See my article
              - link "over here" [ref=f33e50] [cursor=pointer]:
                - /url: ../adb-gui-tools
              - text: for some of the best ones.
            - separator [ref=f33e51]
            - heading "The first time" [level=2] [ref=f33e52]
            - paragraph [ref=f33e53]: "Before you use ADB for the first time, you have to do some setup:"
            - paragraph [ref=f33e54]:
              - strong [ref=f33e55]: "Drivers:"
              - text: If you’re unfortunate enough to be using Windows, then you’ll need to install drivers.
            - paragraph [ref=f33e56]:
              - text: You can download a Universal ADB Drivers installer
              - link "from here" [ref=f33e57] [cursor=pointer]:
                - /url: https://adb.clockworkmod.com/
              - text: .
            - paragraph [ref=f33e58]:
              - text: You’ll also need to
              - strong [ref=f33e59]: enable USB debugging
              - text: on the phone.
            - paragraph [ref=f33e60]: On most phones you can do that by going to Settings > About phone > Build number, and clicking or tapping on Build number quickly 7 times.
            - paragraph [ref=f33e61]: Then go to Settings > System > Advanced > Developer options > USB debugging and enabling USB debugging.
            - paragraph [ref=f33e62]: On some phones you might need to repeat that last step every time the phone restarts.
            - paragraph [ref=f33e63]: The first time you connect the phone to a computer to use ADB, you’ll get a popup on the phone asking you to authorize the connection with that computer.
            - paragraph [ref=f33e64]:
              - text: On the TCL Flip 2, enable USB debugging by dialing
              - code [ref=f33e65]: "*#*#33284#*#*"
              - text: (hint - 33284 is ‘debug’ on the phones keypad).
            - separator [ref=f33e66]
            - paragraph [ref=f33e67]:
              - img "Debloating" [ref=f33e68]
            - heading "ADB in the browser" [level=2] [ref=f33e69]
            - paragraph [ref=f33e70]: If you want to skip having to install ADB apps and drivers, you can use ADB in your browser.
            - paragraph [ref=f33e71]:
              - text: Just go to
              - link "app.tangoapp.dev" [ref=f33e72] [cursor=pointer]:
                - /url: https://app.tangoapp.dev/
              - text: or
              - link "webadb.com" [ref=f33e73] [cursor=pointer]:
                - /url: https://webadb.com/
              - text: ", and you have full ADB in the browser!"
            - paragraph [ref=f33e74]: Browser based ADB works in Chromium based browsers including Chrome, Edge, Vivaldi and Brave.
            - paragraph [ref=f33e75]: It doesn’t work in Firefox based browsers.
            - 'link "Tango: Android tools in the browser A brand new way for managing Android devices. Use file browser, app manager, screen mirror and more right in your browser. Tango: Android tools in the browser favicon app.tangoapp.dev Tango: Android tools in the browser" [ref=f33e76] [cursor=pointer]':
              - /url: https://app.tangoapp.dev
              - generic [ref=f33e77]:
                - generic [ref=f33e78]: "Tango: Android tools in the browser"
                - generic [ref=f33e79]: A brand new way for managing Android devices. Use file browser, app manager, screen mirror and more right in your browser.
                - generic [ref=f33e80]:
                  - 'img "Tango: Android tools in the browser favicon" [ref=f33e81]'
                  - generic [ref=f33e82]: app.tangoapp.dev
              - 'img "Tango: Android tools in the browser" [ref=f33e84]'
            - link "WebADB WebADB is a website which allows you to run ADB in your browser. Features include ADB shell, apk installation, a file manager, scrcpy, screenshots and much more. WebADB favicon webadb.com WebADB" [ref=f33e85] [cursor=pointer]:
              - /url: https://webadb.com
              - generic [ref=f33e86]:
                - generic [ref=f33e87]: WebADB
                - generic [ref=f33e88]: WebADB is a website which allows you to run ADB in your browser. Features include ADB shell, apk installation, a file manager, scrcpy, screenshots and much more.
                - generic [ref=f33e89]:
                  - img "WebADB favicon" [ref=f33e90]
                  - generic [ref=f33e91]: webadb.com
              - img "WebADB" [ref=f33e93]
            - separator [ref=f33e94]
            - heading "Scrcpy - screen mirroring" [level=2] [ref=f33e95]
            - paragraph [ref=f33e96]: Scrcpy uses ADB to mirror your phones screen to your computer, and let’s you control it from you computer.
            - paragraph [ref=f33e97]:
              - text: You can
              - link "download it from here" [ref=f33e98] [cursor=pointer]:
                - /url: https://guiscrcpy.srev.in/
              - text: .
            - separator [ref=f33e99]
            - heading "ADB Commands" [level=2] [ref=f33e100]
            - paragraph [ref=f33e101]:
              - text: If you
              - emphasis [ref=f33e102]: do
              - text: "want to learn about using ADB the old fashioned way, here are some useful commands:"
            - paragraph [ref=f33e103]:
              - code [ref=f33e104]: adb devices
              - text: shows which devices are connected to the computer.
            - paragraph [ref=f33e105]:
              - code [ref=f33e106]: adb reboot
              - text: restarts the phone.
            - paragraph [ref=f33e107]:
              - code [ref=f33e108]: adb reboot safe
              - text: restarts the phone into safe mode. Can be helpful if you were tinkering and messed up.
            - paragraph [ref=f33e109]:
              - text: Many commands start with
              - code [ref=f33e110]: adb shell
              - text: .
            - paragraph [ref=f33e111]: PM is the package manager, which deals with apps.
            - paragraph [ref=f33e112]:
              - code [ref=f33e113]: adb shell pm list packages
              - text: will list all installed apps.
            - paragraph [ref=f33e114]:
              - code [ref=f33e115]: adb shell pm list packages -3
              - text: lists all third party apps you installed.
            - paragraph [ref=f33e116]:
              - code [ref=f33e117]: "adb shell pm install {path to APK on the phone}"
              - text: will install an APK that’s on your phone.
            - paragraph [ref=f33e118]:
              - code [ref=f33e119]: "adb shell pm uninstall {package name}"
              - text: will uninstall an installed app.
            - paragraph [ref=f33e120]:
              - code [ref=f33e121]: "adb shell pm uninstall --user 0 {package name}"
              - text: only uninstalls the app from the phones main user. This can be useful for uninstalling apps that can’t be completely removed removed from the phone, like apps that came with the phone.
            - paragraph [ref=f33e122]:
              - code [ref=f33e123]: "adb shell pm disable-user {package name}"
              - text: will disable an installed app.
            - paragraph [ref=f33e124]:
              - code [ref=f33e125]: "adb shell pm clear {package_name}"
              - text: will clear the apps data, resetting it completely. This can help if you’re having problems with an app that you didn’t have before.
            - paragraph [ref=f33e126]:
              - code [ref=f33e127]: "adb shell am force-stop {package_name}"
              - text: will kill the app.
            - paragraph [ref=f33e128]:
              - code [ref=f33e129]: "adb shell wm density {DPI}"
              - text: changes the screen density. Lowering the DPI can make apps designed for larger screens fit better on a small dumbphone screen by making everything appear smaller.
            - paragraph [ref=f33e130]:
              - code [ref=f33e131]: adb shell wm density reset
              - text: resets the screen density to its default.
            - separator [ref=f33e132]
            - heading "Shizuku" [level=2] [ref=f33e133]
            - paragraph [ref=f33e134]: Shizuku is an Android app that allows apps to take advantage of ADBs superpowers, letting it do things that wouldn’t otherwise be possible.
            - paragraph [ref=f33e135]: There are many apps that use Shizuku, including debloaters, app managers, and app installers.
            - paragraph [ref=f33e136]:
              - text: See this
              - link "awesome list" [ref=f33e137] [cursor=pointer]:
                - /url: https://github.com/timschneeb/awesome-shizuku
              - text: for a comprehensive collection of apps that use Shizuku.
            - link "Shizuku Let your app use system APIs directly Shizuku favicon shizuku.rikka.app" [ref=f33e138] [cursor=pointer]:
              - /url: https://shizuku.rikka.app/
              - generic [ref=f33e139]:
