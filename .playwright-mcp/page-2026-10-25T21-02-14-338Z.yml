            - heading "Armv8, armv7, and x86 builds" [level=2] [ref=f1e252]
            - paragraph [ref=f1e253]: Some developers, instead of distributing apps as split APK formats that aren’t natively supported, choose to just build multiple APKs for each device type.
            - paragraph [ref=f1e254]: The most important thing to focus on is processor architecture. You might see APKs for armv8, sometimes referred to as x64, and for armv7, and x86.
            - paragraph [ref=f1e255]: Most modern Android devices are armv8.
            - paragraph [ref=f1e256]: Older devices and Android dumbphones might be armv7.
            - paragraph [ref=f1e257]: x86 builds are for Chromebooks with AMD/Intel processors, and Android emulators on PCs.
            - separator [ref=f1e258]
            - paragraph [ref=f1e259]: Whether you’re daily-driving a dumbphone that doesn’t support Play Services, keeping your smartphone degoogled for privacy, or you just prefer sideloading raw APKs without being tied to an app store, you have plenty of options.
            - paragraph [ref=f1e260]: You don’t need Google’s official store to get the apps you need. With a little bit of know-how and the right tools, you can forget about the Play Store entirely and set up your device exactly the way you want it.
