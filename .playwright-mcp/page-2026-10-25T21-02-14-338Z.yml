            - heading "The Play Store’s darker side" [level=2] [ref=f1e65]
            - paragraph [ref=f1e66]: While Google Play dominates app distribution on Android, and may appear convenient, it comes with several drawbacks.
            - paragraph [ref=f1e67]: It’s dependent on Google Play Services, which is extremely invasive, resource intensive, and isn’t available on all devices.
            - paragraph [ref=f1e68]: It imposes strict requirements on developers, making it not worthwhile for some hobbyist developers to publish their apps on Google Play.
            - paragraph [ref=f1e69]: Additionally, Google takes a steep 30% tax on all in-app purchases and subscriptions, reducing developer revenue and potentially making apps and services more expensive.
            - paragraph [ref=f1e70]: The following apps and sites are great alternatives to Google Play, offering better privacy, flexibility, and sometimes apps that aren’t available on the Play Store.
            - separator [ref=f1e71]
            - heading "Google Play Clients" [level=2] [ref=f1e72]
            - heading "Aurora Store" [level=3] [ref=f1e73]
            - paragraph [ref=f1e74]: Aurora Store is an open source, privacy-friendly app store that doesn’t have its own library of apps. Instead, it downloads them directly from Google’s servers, using reverse-engineered unofficial Google Play APIs.
            - paragraph [ref=f1e75]: It allows you to spoof your region and device model, allowing you to access apps that might not otherwise be available to you.
            - paragraph [ref=f1e76]:
              - text: Aurora lets you install apps using Androids native installer, Shizuku, and root, and
              - link "this fork" [ref=f1e77] [cursor=pointer]:
                - /url: https://github.com/alltechdev/dhizuku-app-installer
              - text: also offers an option to install with Dhizuku.
            - link "auroraoss.com auroraoss.com favicon auroraoss.com" [ref=f1e78] [cursor=pointer]:
              - /url: https://auroraoss.com/
