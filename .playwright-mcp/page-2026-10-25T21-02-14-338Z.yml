            - heading "F-Droid" [level=3] [ref=f1e115]
            - paragraph [ref=f1e116]: F-Droid is a repository exclusively for open-source apps.
            - paragraph [ref=f1e117]: Ironically, since most of these apps are built by hobbyist and end-users, instead of companies chasing profits, these apps are often higher quality than what you’ll find on other app stores.
            - paragraph [ref=f1e118]:
              - text: As all apps on F-Droid are open-source, it’s considered the most secure source of apps, so the risk of malware is very low. You can access F-Droid apps via their website, their official app store, or through third-party clients like
