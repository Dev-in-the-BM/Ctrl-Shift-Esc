            - heading "IzzyOnDroid" [level=3] [ref=f1e141]
            - paragraph [ref=f1e142]: IzzyOnDroid is another repository of open-source apps, designed to integrate with standard F-Droid clients.
            - paragraph [ref=f1e143]: It has some differing philosophies than F-Droid, leading to it having a larger selection of apps than F-Droid.
            - paragraph [ref=f1e144]: It can be accessed in the same ways as F-Droid, through its website and F-Droid clients, and the Droidify F-Droid client comes with IzzyOnDroid enabled out of the box.
