            - heading "Sites that host apps themselves" [level=2] [ref=f1e157]
            - paragraph [ref=f1e158]: APKMirror, Uptodown, and APKpure are the best sites to download proprietary apps from, that host apps the apps themselves.
            - paragraph [ref=f1e159]: The differences between these are security, curation, and the app store experience.
            - heading "APKMirror" [level=3] [ref=f1e160]
            - paragraph [ref=f1e161]: APKMirror is one of the most secure sites for downloading apps that are also available on Google Play.
            - paragraph [ref=f1e162]: They only host apps that are already available on Google Play, relying on the fact that Google vets apps before allowing them onto the Play Store.
            - paragraph [ref=f1e163]: They use signature verification to ensure that the APK they’re giving you is authentic and wasn’t tampered with.
            - paragraph [ref=f1e164]: Its downside is that it doesn’t have an app store to install apps directly to your phone.
            - paragraph [ref=f1e165]: You have to first download the APK from their website, and then manually install it.
            - link "APKMirror - Free APK Downloads - Free and safe Android APK downloads Free and safe Android APK downloads APKMirror - Free APK Downloads - Free and safe Android APK downloads favicon apkmirror.com" [ref=f1e166] [cursor=pointer]:
              - /url: https://www.apkmirror.com/
              - generic [ref=f1e167]:
                - generic [ref=f1e168]: APKMirror - Free APK Downloads - Free and safe Android APK downloads
                - generic [ref=f1e169]: Free and safe Android APK downloads
                - generic [ref=f1e170]:
                  - img "APKMirror - Free APK Downloads - Free and safe Android APK downloads favicon" [ref=f1e171]
                  - generic [ref=f1e172]: apkmirror.com
            - heading "Uptodown" [level=3] [ref=f1e173]
            - paragraph [ref=f1e174]: Uptodown is another Google Play alternative with their own database of apps.
            - paragraph [ref=f1e175]: Unlike APKMirror, Uptodown also offers apps that aren’t available on Google Play, which means that you can get apps that weren’t vetted by Google, but they have their own security features to protect you from malware.
            - paragraph [ref=f1e176]: All apps are automatically scanned by VirusTotal, and the results are shown on the app’s page, letting you choose if you want to trust the app.
            - paragraph [ref=f1e177]: Like APKMirror, Uptodown enforces signature verification, so if an app is also available on Google Play, then what Uptodown is giving you is guaranteed to be authentic.
            - paragraph [ref=f1e178]: Uptodown has its own app store, allowing you to search for, install, and update apps directly with their app, making things a lot simpler than APKMirror.
            - link "Uptodown.com The user-friendly way to get apps Uptodown.com favicon en.uptodown.com Uptodown.com" [ref=f1e179] [cursor=pointer]:
              - /url: https://en.uptodown.com
              - generic [ref=f1e180]:
                - generic [ref=f1e181]: Uptodown.com
                - generic [ref=f1e182]: The user-friendly way to get apps
                - generic [ref=f1e183]:
                  - img "Uptodown.com favicon" [ref=f1e184]
                  - generic [ref=f1e185]: en.uptodown.com
              - img "Uptodown.com" [ref=f1e187]
            - heading "APKPure" [level=3] [ref=f1e188]
            - paragraph [ref=f1e189]: APKPure is the most popular website for downloading apps, but it isn’t necessarily the best.
            - paragraph [ref=f1e190]: While currently its security is pretty much on par with APKMirror and Uptodown, it has had incidents in the past, staining its reputation, even though they’ve significantly upped their security since then.
            - paragraph [ref=f1e191]: APKPure allows you to choose which regional variant of an app to install.
            - paragraph [ref=f1e192]: Its bots scrape Google Play aggressively, often being the first one to offer updates to apps from when they’re released.
            - paragraph [ref=f1e193]: It also is the only one to copy Google Play’s ability to follow and get news on apps that weren’t yet released.
            - paragraph [ref=f1e194]: They also keep the most archives of older versions of apps.
            - link "apkpure.com apkpure.com favicon apkpure.com" [ref=f1e195] [cursor=pointer]:
              - /url: https://apkpure.com/
              - generic [ref=f1e196]:
                - generic [ref=f1e197]: apkpure.com
                - generic [ref=f1e198]:
                  - img "apkpure.com favicon" [ref=f1e199]
                  - generic [ref=f1e200]: apkpure.com
            - separator [ref=f1e201]
            - heading "XAPK, APKM, APKS - What happened to the simple APK?" [level=2] [ref=f1e202]
            - paragraph [ref=f1e203]: For over a decade, Android apps were built and installed as APK files.
            - paragraph [ref=f1e204]: Even if you got your apps from Google Play, the Play Store and Google Play’s servers were dealing with APK files. If you obtained apps from other sources, it was as simple as downloading an APK file and installing it from Android’s file manager. However, if you try to download APKs from websites now, you might notice that many apps aren’t available as APKs anymore.
            - paragraph [ref=f1e205]: Instead, you’ll be offered XAPKs, APKMs, APKS’s, and other formats.
            - paragraph [ref=f1e206]: The reason for that is that Google has changed how apps are built and delivered, moving from monolithic APKs to split APKs.
            - paragraph [ref=f1e207]: Previously, the entire app, including all its code designed for various processor architectures, screen sizes, and languages, would be bundled into a single APK file. This often meant the app took up significant space on your phone for components that your device didn’t need.
            - paragraph [ref=f1e208]: Now, with split APKs, device-specific components are generated as separate APKs, ensuring your phone only downloads the parts it needs.
            - paragraph [ref=f1e209]: While this is much more efficient, the standard APK file format cannot bundle multiple APKs. Google also didn’t provide a new file format for bundling multiple APKs, leaving us without a native way to distribute split APKs outside of the Play Store.
            - paragraph [ref=f1e210]: A bunch of different vendors each tried solving this, leaving us with a bunch of new formats.
            - paragraph [ref=f1e211]: XAPK, created by APKPure, is the most popular, but APKS is also popular and widely supported.
