            - paragraph [ref=f36e65]: The Sonim Xp5Plus 5G is a phone with modern internals, in a simple package.If you want a phone that’s indestructible, has great battery life, modern Android specs, inside of a dumb brick bar form factor, then this is your phone.
            - paragraph [ref=f36e66]: Overall, this sounds like a terrific phone, and I can’t wait to get my hands on it and try it.
