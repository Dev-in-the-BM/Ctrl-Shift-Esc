        - heading "Sonim brings us another 5G dumbphone, and its specs are impressive" [level=1] [ref=f36e23]
        - paragraph [ref=f36e24]: It's been a year since we last heard from Sonim, and they're back, with another phone with premium performance and military grade durability.
