          - generic [ref=f36e31]:
            - heading "Sonim does it again" [level=2] [ref=f36e32]
            - paragraph [ref=f36e33]: The last time we heard from Sonim was when they released the Sonim Xp3Plus 5G, one of the first 5G dumbphones.A year later Sonim is back and doing it again, releasing another phone with premium performance and military grade durability.
            - paragraph [ref=f36e34]: The successor to the Sonim Xp5900, it’s been upgraded with 5G, Android 15, and powerful internals.
            - paragraph [ref=f36e35]: While the older Xp5Plus’s processor was already impressive, the Xp5Plus 5G takes things to a whole new level.It’s Snapdragon 4 Gen 2 uses Cortex-A78 performance cores, built on a 4nm process, giving it processing power and greater battery efficieny, and surpassing pretty much every dumb/minimalist phone out there, besides for Unihertz’s.
            - paragraph [ref=f36e36]: It has a 3500 mAh battery, with 15W fast charging. Combined that it’s uber effecient processor, and we have a phone that lasts as long as you need it.
            - paragraph [ref=f36e37]: It’s also upgraded with a generous 4 GB of RAM, 64 GB of storage, and a AOSP 15 based OS.
            - paragraph [ref=f36e38]: All this comes at a price, and the Xp3Plus 5G sells for $330, which isn’t cheap.
            - separator [ref=f36e39]
